# DabaPulse API — Render Blueprint
# https://render.com/docs/blueprint-spec
#
# Déploiement en 1 clic depuis le dashboard Render :
#   New → Blueprint → Connect Stane316/daba-pulse → Branch engineering-lead/mvp-foundation
#
# Après le premier deploy :
# 1. Copier l'URL du service (https://dabapulse-api-xxxx.onrender.com)
# 2. Dans Netlify → Environment → VITE_API_URL = cette URL (sans / final)
# 3. Sur Render → Environment → CORS_ORIGINS = https://<site>.netlify.app
# 4. Lancer le smoke : bash scripts/smoke.sh https://<api>.onrender.com

services:
  - type: web
    name: dabapulse-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: bash scripts/start-api.sh
    healthCheckPath: /api/health
    autoDeploy: true
    numInstances: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DATA_PATH
        # Chemin du dataset synthétique dans le checkout Render
        value: /opt/render/project/src/data/sample
      - key: CORS_ORIGINS
        # "*": OK pour le premier deploy ; restreindre à l'URL Netlify après (ex: https://dabapulse.netlify.app)
        value: "*"
      - key: AI_ENABLED
        value: "true"
      - key: OPENAI_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENAI_MODEL
        value: openai/gpt-4o-mini
      - key: OPENAI_API_KEY
        # Secret optionnel — à renseigner dans Render Dashboard → Environment si LLM souhaité
        sync: false
      - key: API_JSON_LOGS
        value: "true"
