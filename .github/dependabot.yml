version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels: ["dependencies", "backend"]
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels: ["dependencies", "frontend"]
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    # React Router 8.x n'est pas exploitable sans react-router-dom@8.
    # Bloquer les bumps majeurs auto qui casseraient le build (PR #2).
    ignore:
      - dependency-name: "react-router"
        versions: [">=8.0.0"]
      - dependency-name: "react-router-dom"
        versions: [">=8.0.0"]
