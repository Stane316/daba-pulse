name: DabaPulse CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dabapulse-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


# ============================================================
# FRONTEND
# ============================================================

jobs:

  frontend:
    name: Frontend — Lint, Typecheck & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint
        continue-on-error: false

      - name: Run TypeScript check
        run: npm run typecheck
        continue-on-error: false

      - name: Build frontend
        run: npm run build


# ============================================================
# BACKEND
# ============================================================

  backend:
    name: Backend — Tests & Quality
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff
        run: ruff check .

      - name: Run Pytest
        run: pytest -q


# ============================================================
# SECURITY / REPOSITORY CHECKS
# ============================================================

  security:
    name: Security — Secrets & Repository Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for accidental environment files
        shell: bash
        run: |
          if find . \
            -type f \
            \( -name ".env" \
            -o -name ".env.local" \
            -o -name ".env.production" \
            -o -name ".env.development" \) \
            -not -path "./.git/*" \
            | grep -q .; then

            echo "❌ Environment file detected in repository."
            echo "Do not commit secrets or environment-specific credentials."
            exit 1

          else
            echo "✅ No forbidden environment files detected."
          fi

      - name: Check for private key files
        shell: bash
        run: |
          if find . \
            -type f \
            \( -name "*.pem" \
            -o -name "*.key" \
            -o -name "*.p12" \
            -o -name "*.pfx" \) \
            -not -path "./.git/*" \
            | grep -q .; then

            echo "❌ Private key or certificate file detected."
            echo "Remove it from the repository."
            exit 1

          else
            echo "✅ No private key files detected."
          fi

      - name: Verify .env.example exists
        shell: bash
        run: |
          if [ ! -f ".env.example" ]; then
            echo "❌ .env.example is missing."
            exit 1
          fi

          echo "✅ .env.example detected."

      - name: Verify README exists
        shell: bash
        run: |
          if [ ! -f "README.md" ]; then
            echo "❌ README.md is missing."
            exit 1
          fi

          echo "✅ README.md detected."


# ============================================================
# CI SUMMARY
# ============================================================

  ci-summary:
    name: DabaPulse CI — Summary
    runs-on: ubuntu-latest

    needs:
      - frontend
      - backend
      - security

    if: always()

    steps:
      - name: Evaluate CI results
        shell: bash
        run: |
          echo "Frontend status: ${{ needs.frontend.result }}"
          echo "Backend status: ${{ needs.backend.result }}"
          echo "Security status: ${{ needs.security.result }}"

          if [ "${{ needs.frontend.result }}" != "success" ] || \
             [ "${{ needs.backend.result }}" != "success" ] || \
             [ "${{ needs.security.result }}" != "success" ]; then

            echo "❌ DabaPulse CI failed."
            exit 1

          fi

          echo "✅ DabaPulse CI passed successfully."