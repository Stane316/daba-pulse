name: DabaPulse CI

on:
  push:
    branches:
      - main
      - develop
      - "engineering-lead/**"
      - "feature/**"
      - "fix/**"

  pull_request:
    branches:
      - main
      - develop
      - "engineering-lead/**"


  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dabapulse-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  frontend:
    name: Frontend — Lint, Typecheck & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run oxlint
        run: npm run lint

      - name: Run TypeScript check
        run: npm run typecheck

      - name: Build frontend
        run: npm run build


  backend:
    name: Backend — Tests & Quality
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      DATA_PATH: ${{ github.workspace }}/data/sample

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff
        run: ruff check app

      - name: Run Pytest
        run: |
          echo "DATA_PATH=$DATA_PATH"
          ls -la "$DATA_PATH" | head
          pytest -q ../tests


  security:
    name: Security — Secrets & Repository Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for accidental environment files
        shell: bash
        run: |
          if find . \
            -type f \
            \( -name ".env" \
            -o -name ".env.local" \
            -o -name ".env.production" \
            -o -name ".env.development" \) \
            -not -path "./.git/*" \
            | grep -q .; then

            echo "❌ Environment file detected in repository."
            
            exit 1

          fi
          echo "✅ No forbidden environment files detected."

      - name: Check for private key files
        shell: bash
        run: |
          if find . \
            -type f \
            \( -name "*.pem" \
            -o -name "*.key" \
            -o -name "*.p12" \
            -o -name "*.pfx" \) \
            -not -path "./.git/*" \
            | grep -q .; then

            echo "❌ Private key or certificate file detected."
            
            exit 1

          fi
          echo "✅ No private key files detected."

      - name: Verify .env.example exists
        shell: bash
        run: |
          
          test -f ".env.example"
          echo "✅ .env.example detected."

      - name: Verify README exists
        shell: bash
        run: |

          test -f "README.md"
          echo "✅ README.md detected."

      - name: Verify backend models are tracked
        shell: bash
        run: |
          test -f "backend/app/models/schemas.py"
          test -f "backend/app/models/__init__.py"
          echo "✅ backend/app/models tracked."

  ci-summary:
    name: DabaPulse CI — Summary
    runs-on: ubuntu-latest

    needs:
      - frontend
      - backend
      - security

    if: always()

    steps:
      - name: Evaluate CI results
        shell: bash
        run: |
          echo "Frontend: ${{ needs.frontend.result }}"
          echo "Backend: ${{ needs.backend.result }}"
          echo "Security: ${{ needs.security.result }}"

          if [ "${{ needs.frontend.result }}" != "success" ] || \
             [ "${{ needs.backend.result }}" != "success" ] || \
             [ "${{ needs.security.result }}" != "success" ]; then

            echo "❌ DabaPulse CI failed."
            exit 1

          fi

          echo "✅ DabaPulse CI passed successfully."